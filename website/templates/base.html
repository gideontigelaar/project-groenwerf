<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Groenwerf{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="sidebar">
        <h2>Groenvoorziening</h2>

        <ul>
            <a href="{{ url_for('index') }}">
                <li class="{{ 'active' if active_page == 'index' }}">Dashboard</li>
            </a>

            <a href="{{ url_for('rawdata') }}">
                <li class="{{ 'active' if active_page == 'rawdata' }}">Rauwe data</li>
            </a>

            <a href="{{ url_for('rapport') }}">
                <li class="{{ 'active' if active_page == 'rapport' }}">Rapport</li>
            </a>    
        </ul>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
