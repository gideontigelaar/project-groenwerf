{% extends "base.html" %} {% block title %}Rauwe data{% endblock %} {% block
content %}
<div class="p-8">
  <!-- Search bar -->
  <div class="flex mb-6">
    <input
      class="flex-1 px-4 py-2 rounded-l-lg border-0 bg-[#1f3d2b] text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-[#6aa84f]"
      type="search"
      placeholder="Search"
      aria-label="Search"
    />
    <select
      id="sortSelect"
      class="px-4 py-2 border-0 bg-[#1f3d2b] text-white focus:outline-none"
    >
      <option value="measured_at">Time</option>
      <option value="tof_mm">Grass Height (TOF)</option>
      <option value="sonic_mm">Grass Height (Sonic)</option>
      <option value="longitude">Longitude</option>
      <option value="latitude">Latitude</option>
    </select>
    <button
      class="px-5 py-2 rounded-r-lg bg-[#1f3d2b] text-white hover:bg-[#6aa84f] transition-colors"
      onclick="fetchData()"
    >
      Search
    </button>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-2xl shadow overflow-hidden">
    <table class="table table-striped table-hover mb-0">
      <thead class="bg-[#1f3d2b] text-white">
        <tr>
          <th>Grass Height (TOF)</th>
          <th>Grass Height (Sonic)</th>
          <th colspan="2">Address</th>
          <th>Measured at</th>
        </tr>
      </thead>
      <tbody id="dataTableBody">
        <tr>
          <td colspan="5" class="text-center text-gray-400 py-4">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='fetchdata.js') }}"></script>
{% endblock %}
